<!DOCTYPE html>
<html>
    <head>
        <title>Div ile HTML Web Sayfası Şablonu</title>
        <style>
            header{
                width: 900px; 
                border:1px dotted darkblue;
                height: 60px;
                background-color: orange;
                text-align: center;
                     }
            nav{
                width: 200px; 
                border:1px dotted darkblue;
                height: 200px;
                background-color: purple;
                text-align: center;
                float: left;
                }
            section{
                width: 500px; 
                border:1px dotted darkblue;
                height: 200px;
                background-color: rgb(128, 78, 128);
                text-align: center;
                float: left;
            }
            aside{
                width: 200px; 
                border:1px dotted darkblue;
                height: 200px;
                background-color: rgb(58, 8, 238);
                text-align: center;
                float: left;
                }
            footer{
                    width: 900px; 
                    border:1px dotted darkblue;
                    height: 40px;
                    background-color: gray;
                    text-align: center;
                    clear: left;
                }
            section header{
                    width: 90%; 
                    border:1px dotted rgb(11, 134, 62);
                    height: 40px;
                    background-color: orange;
                    text-align: center;
                    line-height: 40px;
                    margin: auto auto;
                }
            section article{
                    width: 90%; 
                    border:1px dotted rgb(0, 139, 63);
                    height: 60px;
                    background-color: tomato;
                    text-align: center;
                    line-height: 40px;
                     margin: 20px auto;
                 }
            section footer{
                    width: 90%; 
                    border:1px dotted rgb(0, 139, 58);
                    height: 40px;
                    background-color: gray;
                    text-align: center;
                    line-height: 40px;
                    margin: auto auto;
                }

        </style>
    </head>
    <body>
        <header >HEADER</header>
        <nav>NAV</nav>
        <section >SECTİON
                <sheader >HEADER</sheader>
                <article >ARTICLE</article>
                <sfooter >FOOTER</footer>


        </section>
        <aside >ASİDE</aside>
        <footer >FOOTER</footer>
    </body>
</html>
